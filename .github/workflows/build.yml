name: Build PrintTool

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 GitHub 网页上手动点击运行

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build and Package for Windows
        run: ./gradlew package

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: PrintTool-Windows-EXE
          path: build/compose/binaries/main/app/*.exe
          # 如果打包生成的是 .msi，请将上面一行改成 path: build/compose/binaries/main/app/*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build and Package for macOS
        run: chmod +x gradlew && ./gradlew package

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: PrintTool-macOS-DMG
          path: build/compose/binaries/main/app/*.dmg
