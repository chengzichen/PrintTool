name: Build PrintTool

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 GitHub 网页上手动点击运行

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Package for Windows
        run: ./gradlew package

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrintTool-Windows
          path: build/compose/binaries/main/**/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Package for macOS
        run: chmod +x gradlew && ./gradlew package

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrintTool-macOS-DMG
          path: build/compose/binaries/main/**/*.dmg
